name: Regenerate Supabase Types

# Manual trigger only — run it from the Actions tab after any schema change.
#
# Exists because the project is maintained without a local Supabase CLI. The
# checked-in types were hand-written and had drifted badly: 26 of the 48 tables
# in production were missing, and every missing table makes supabase-js infer
# `never`, which is what produces the bulk of the typecheck errors. Several
# tables were also created through the dashboard rather than a migration, so the
# live database is the only source that knows their real shape.

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TARGET: src/integrations/supabase/database.generated.ts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID secret is not set"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate types
        run: |
          set -euo pipefail
          # Write to a temp file first: a failed generation must not leave a
          # truncated types file behind.
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_ID" \
            > /tmp/database.generated.ts

          if [ ! -s /tmp/database.generated.ts ]; then
            echo "::error::Generated file is empty — refusing to overwrite"
            exit 1
          fi
          if ! grep -q "export type Database" /tmp/database.generated.ts; then
            echo "::error::Generated file has no Database type — refusing to overwrite"
            exit 1
          fi

          {
            echo "/**"
            echo " * GENERATED FILE — do not edit by hand."
            echo " *"
            echo " * Produced by .github/workflows/generate-supabase-types.yml."
            echo " * Import from ./database.types, which re-exports Database and Json"
            echo " * from here and adds the app's hand-written aliases."
            echo " */"
            cat /tmp/database.generated.ts
          } > "$TARGET"

      - name: Report table coverage
        run: |
          n=$(grep -cE "^      [a-z_]+: \{" "$TARGET" || true)
          echo "### Supabase types regenerated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tables covered: \`$n\`" >> $GITHUB_STEP_SUMMARY

      - name: Commit if changed
        run: |
          if git diff --quiet -- "$TARGET"; then
            echo "No schema drift — types already current."
            echo "No change." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "chore(types): regenerate Supabase types from live schema"
          git push
          echo "Committed regenerated types." >> $GITHUB_STEP_SUMMARY
