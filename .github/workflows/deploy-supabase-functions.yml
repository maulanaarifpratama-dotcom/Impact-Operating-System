name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID secret is not set"
            exit 1
          fi

      - name: Deploy all edge functions
        run: |
          set -euo pipefail
          cd supabase/functions
          # Iterate over every function directory except _shared.
          # _shared is imported via relative paths and ships with each
          # function bundle, so it does not need its own deploy.
          for dir in */ ; do
            name="${dir%/}"
            if [ "$name" = "_shared" ]; then
              echo "Skipping shared module: $name"
              continue
            fi
            echo "::group::Deploying $name"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_ID"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          echo "### Supabase deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Project ref: \`$SUPABASE_PROJECT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
