# Supabase project configuration for Impactory.
# Consumed by the Supabase CLI when running:
#   supabase functions deploy --project-ref <YOUR_REF>
#
# Edge functions in this project (deployed automatically via
# .github/workflows/deploy-supabase-functions.yml):
#   ads-generate           -> Foundry-powered ad-copy generator
#   grant-writer-chat      -> streaming chat assistant for grant writer
#   grant-writer-generate  -> Foundry-powered LFA + proposal generator
#   grantfinder-index      -> admin: re-embed grant corpus into pgvector
#   grantfinder-search     -> public: vector + keyword search over grants
#   library-ingest         -> chunk + embed library documents
#   library-rag            -> cited Q&A over library corpus

project_id = "impactory"

# Functions that call Azure AI Foundry can take 10-30s for long
# generations. Bump verify_jwt = false only for explicitly public
# search endpoints (none right now). All others require an end-user
# session token.

[functions.ads-generate]
verify_jwt = true

[functions.grant-writer-chat]
verify_jwt = true

[functions.grant-writer-generate]
verify_jwt = true

[functions.grantfinder-index]
verify_jwt = true

[functions.grantfinder-search]
verify_jwt = true

[functions.library-ingest]
verify_jwt = true

[functions.library-rag]
verify_jwt = true
